<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Para Lais Santos Futamata</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- TOPO -->
  <header class="topo">
    <h1>Para Lais Santos Futamata</h1>
    <p class="frase" id="frase"></p>
    <p class="seta">role para baixo ↓</p>
  </header>

  <!-- CONTADOR -->
  <section class="contador reveal">
    <h2>Desde a noite em que nos conhecemos</h2>
    <div class="relogio">
      <div><span id="c-dias">0</span><small>dias</small></div>
      <div><span id="c-horas">0</span><small>horas</small></div>
      <div><span id="c-min">0</span><small>min</small></div>
      <div><span id="c-seg">0</span><small>seg</small></div>
    </div>
  </section>

  <!-- GALERIA -->
  <section id="galeria" class="galeria">
    <h2>Nossas fotos</h2>
    <p class="dica">Toque nas fotos para ver a lembrança</p>
    <div class="grade">

      <figure class="horizontal reveal" data-texto="12/09/2026: a gente se conheceu numa festa, de noite, no meio de tanta gente, e foi o melhor encontro do acaso que eu poderia ter.">
        <img src="fotos/foto1.jpg" alt="A noite que tudo começou" onerror="this.style.display='none'">
        <figcaption>A noite que tudo começou</figcaption>
      </figure>

      <figure class="reveal" data-texto="Nervosos e felizes ao mesmo tempo. Foi ali que eu percebi que queria muito mais momentos ao seu lado.">
        <img src="fotos/foto2.jpg" alt="Nosso primeiro encontro" onerror="this.style.display='none'">
        <figcaption>Nosso primeiro encontro</figcaption>
      </figure>

      <figure class="reveal" data-texto="Uma noite simples que ficou especial só por ter você junto comigo.">
        <img src="fotos/foto3.jpg" alt="Noite no cinema" onerror="this.style.display='none'">
        <figcaption>Noite no cinema</figcaption>
      </figure>

      <figure class="reveal" data-texto="Risadas, luzes e uma noite que eu queria que durasse bem mais.">
        <img src="fotos/foto4.jpg" alt="Noite no parque" onerror="this.style.display='none'">
        <figcaption>Noite no parque</figcaption>
      </figure>

    </div>
  </section>

  <!-- RODAPÉ -->
  <footer class="rodape">
    <p>Feito com carinho para Lais Santos Futamata ♥</p>
  </footer>

  <!-- FOTO AMPLIADA -->
  <div id="lightbox" class="lightbox" aria-hidden="true">
    <div class="caixa">
      <button id="fechar" class="fechar" type="button" aria-label="Fechar">×</button>
      <button id="anterior" class="seta-lb esq" type="button" aria-label="Foto anterior">‹</button>
      <button id="proxima" class="seta-lb dir" type="button" aria-label="Próxima foto">›</button>
      <img id="lb-img" alt="">
      <h3 id="lb-titulo"></h3>
      <p id="lb-texto"></p>
      <p id="lb-contagem" class="contagem"></p>
    </div>
  </div>

  <!-- MÚSICA -->
  <audio id="musica" src="musica/feminina.mp3" loop></audio>

  <script>
    /* ====== CONFIGURAÇÕES ====== */
    var FRASE = "Cada momento ao seu lado vira uma lembrança que eu quero guardar.";
    var DATA_INICIAL = new Date("2026-09-12T00:00:00"); /* dia em que nos conhecemos */
    var INICIO = 65;   /* música: começa em 1:05 */
    var FIM = 110;     /* música: termina em 1:50 */

    /* ====== FRASE DIGITANDO ====== */
    var fraseEl = document.getElementById("frase");
    var i = 0;
    function digitar() {
      if (i <= FRASE.length) {
        fraseEl.textContent = FRASE.slice(0, i);
        i++;
        setTimeout(digitar, 45);
      }
    }
    digitar();

    /* ====== CONTADOR ====== */
    function atualizar() {
      var s = Math.max(0, Math.floor((new Date() - DATA_INICIAL) / 1000));
      document.getElementById("c-dias").textContent = Math.floor(s / 86400);
      document.getElementById("c-horas").textContent = Math.floor((s % 86400) / 3600);
      document.getElementById("c-min").textContent = Math.floor((s % 3600) / 60);
      document.getElementById("c-seg").textContent = s % 60;
    }
    atualizar();
    setInterval(atualizar, 1000);

    /* ====== APARECER AO ROLAR ====== */
    var itens = document.querySelectorAll(".reveal");
    if ("IntersectionObserver" in window) {
      var obs = new IntersectionObserver(function (entradas) {
        entradas.forEach(function (e) {
          if (e.isIntersecting) {
            e.target.classList.add("visivel");
            obs.unobserve(e.target);
          }
        });
      }, { threshold: 0.15 });
      itens.forEach(function (el) { obs.observe(el); });
    } else {
      itens.forEach(function (el) { el.classList.add("visivel"); });
    }

    /* ====== FOTO AMPLIADA COM NAVEGAÇÃO ====== */
    var lb = document.getElementById("lightbox");
    var figuras = Array.prototype.slice.call(document.querySelectorAll("figure"));
    var atual = 0;

    function mostrar(n) {
      atual = (n + figuras.length) % figuras.length;
      var fig = figuras[atual];
      var legenda = fig.querySelector("figcaption").textContent;
      var img = document.getElementById("lb-img");
      img.src = fig.querySelector("img").getAttribute("src");
      img.alt = legenda;
      document.getElementById("lb-titulo").textContent = legenda;
      document.getElementById("lb-texto").textContent = fig.dataset.texto || "";
      document.getElementById("lb-contagem").textContent = (atual + 1) + " de " + figuras.length;
    }
    function abrir(n) {
      mostrar(n);
      lb.classList.add("aberto");
      lb.setAttribute("aria-hidden", "false");
    }
    function fecharLb() {
      lb.classList.remove("aberto");
      lb.setAttribute("aria-hidden", "true");
    }

    figuras.forEach(function (fig, idx) {
      fig.addEventListener("click", function () { abrir(idx); });
    });
    document.getElementById("fechar").addEventListener("click", fecharLb);
    document.getElementById("anterior").addEventListener("click", function () { mostrar(atual - 1); });
    document.getElementById("proxima").addEventListener("click", function () { mostrar(atual + 1); });
    lb.addEventListener("click", function (e) { if (e.target === lb) fecharLb(); });

    document.addEventListener("keydown", function (e) {
      if (!lb.classList.contains("aberto")) return;
      if (e.key === "Escape") fecharLb();
      if (e.key === "ArrowLeft") mostrar(atual - 1);
      if (e.key === "ArrowRight") mostrar(atual + 1);
    });

    /* deslizar o dedo para trocar de foto */
    var toqueX = null;
    lb.addEventListener("touchstart", function (e) {
      toqueX = e.touches[0].clientX;
    }, { passive: true });
    lb.addEventListener("touchend", function (e) {
      if (toqueX === null) return;
      var dif = e.changedTouches[0].clientX - toqueX;
      if (Math.abs(dif) > 50) { mostrar(atual + (dif < 0 ? 1 : -1)); }
      toqueX = null;
    });

    /* ====== CORAÇÕES AO TOCAR ====== */
    document.addEventListener("click", function (e) {
      if (e.target.closest(".fechar, .seta-lb")) return;
      var c = document.createElement("span");
      c.className = "coracao";
      c.textContent = ["❤️", "💕", "💖"][Math.floor(Math.random() * 3)];
      c.style.left = e.clientX + "px";
      c.style.top = e.clientY + "px";
      document.body.appendChild(c);
      setTimeout(function () { c.remove(); }, 1200);
    });

    /* ====== MÚSICA (refrão em loop) ====== */
    var audio = document.getElementById("musica");
    function tocar() {
      if (audio.currentTime < INICIO || audio.currentTime >= FIM) {
        audio.currentTime = INICIO;
      }
      var p = audio.play();
      if (p) {
        p.then(removerGatilhos).catch(function () {});
      }
    }
    function removerGatilhos() {
      ["pointerdown", "keydown"].forEach(function (ev) {
        document.removeEventListener(ev, tocar);
      });
    }
    audio.addEventListener("timeupdate", function () {
      if (audio.currentTime >= FIM) { audio.currentTime = INICIO; }
    });
    tocar();
    ["pointerdown", "keydown"].forEach(function (ev) {
      document.addEventListener(ev, tocar);
    });
  </script>

</body>
</html>
